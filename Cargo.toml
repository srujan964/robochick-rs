[workspace]
resolver = "3"
members = ["robochick-events", "lifejacket"]

[workspace.package]
version = "1.0.4"

[workspace.dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", default-features = false, features = [
    "behavior-version-latest",
    "rustls"
] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
aws-sdk-dynamodb = { version = "1.116.0" }

aws-smithy-mocks = "0.2.6"
dotenvy = "0.15.7"
pretty_assertions = "1.4.1"
mockall = "0.13.1"
mockito = "1.7.0"

[workspace.lints.rust]
unused = { level = "allow", priority = -1 }
unsafe_code = "forbid"

[profile.release]
opt-level = "s"
panic = "abort"
strip = "symbols"
codegen-units = 1
lto = true
